image: "$CI_REGISTRY/${CI_ROOT_PATH_PREFIX}docker/base-builder:latest"

stages:
  - lint
  - build
  - test
  - publish

variables:
  RUSTFLAGS: "-D warnings"

rustfmt:
  stage: lint
  script:
    - cargo fmt --check

clippy:
  stage: lint
  script:
    - cargo clippy --all-targets -- -D warnings

build:
  stage: build
  script:
    - cargo build --release --verbose

test:
  stage: test
  script:
    - cargo test

coverage:
  stage: test
  variables:
    COVERAGE_THRESHOLD: 99
  script:
    - cargo llvm-cov --no-report
    - cargo llvm-cov report --cobertura --output-path cobertura.xml
    - cargo llvm-cov report --html --output-dir coverage
    - cargo llvm-cov report --summary-only | awk '/^TOTAL/ {print "Line coverage:", $10}'
    - cargo llvm-cov report --summary-only --fail-under-lines $COVERAGE_THRESHOLD > /dev/null
  coverage: '/Line coverage: \d+\.\d+%/'
  artifacts:
    expose_as: 'Coverage report'
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    expire_in: 1 month

publish:
  stage: publish
  environment: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  script:
    - VERSION=$(cargo pkgid | sed 's/.*[#@]//')
    - export VERSION
    - .gitlab-ci/assert_true.sh '[ "$CI_COMMIT_TAG" = "v$VERSION" ]' "Tag $CI_COMMIT_TAG does not match the version in Cargo.toml ($VERSION)"
    - CARGO_REGISTRY_TOKEN=$(.gitlab-ci/get_crates_io_token.sh)
    - export CARGO_REGISTRY_TOKEN
    - .gitlab-ci/assert_true.sh '[ -n "$CARGO_REGISTRY_TOKEN" ]' "crates.io did not issue a publish token"
    - cargo publish
