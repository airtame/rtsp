image: rust:latest

stages:
  - lint
  - build
  - test
  - publish

variables:
  RUSTFLAGS: "-D warnings"

rustfmt:
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

build:
  stage: build
  script:
    - cargo build --release --verbose

test:
  stage: test
  script:
    - cargo test

coverage:
  stage: test
  variables:
    COVERAGE_THRESHOLD: 99
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked --version 0.9.1
  script:
    - cargo llvm-cov --no-report
    - cargo llvm-cov report --cobertura --output-path cobertura.xml
    - cargo llvm-cov report --html --output-dir coverage
    - cargo llvm-cov report --summary-only | awk '/^TOTAL/ {print "Line coverage:", $10}'
    - cargo llvm-cov report --summary-only --fail-under-lines $COVERAGE_THRESHOLD > /dev/null
  coverage: '/Line coverage: \d+\.\d+%/'
  artifacts:
    expose_as: 'Coverage report'
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    expire_in: 1 month

publish:
  stage: publish
  environment: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq
  script:
    - VERSION=$(cargo pkgid | sed 's/.*[#@]//')
    - |
      if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match the version in Cargo.toml ($VERSION)"
        exit 1
      fi
    - |
      RESPONSE=$(curl --silent --show-error -X POST https://crates.io/api/v1/trusted_publishing/tokens \
        -H "Content-Type: application/json" \
        -H "User-Agent: airtame-rtsp-gitlab-ci (https://gitlab.com/airtame/crates/rtsp)" \
        -d "{\"jwt\": \"$CRATES_IO_ID_TOKEN\"}")
      CARGO_REGISTRY_TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
      if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
        echo "crates.io did not issue a publish token: $RESPONSE"
        exit 1
      fi
      export CARGO_REGISTRY_TOKEN
    - cargo publish
